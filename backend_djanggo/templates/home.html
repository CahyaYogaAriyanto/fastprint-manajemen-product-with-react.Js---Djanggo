<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>FastPrint API</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2563eb, #f97316);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #fff;
            padding: 32px 40px;
            border-radius: 14px;
            width: 380px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #2563eb;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        a {
            display: block;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        a:hover {
            background: #f97316;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>FastPrint API</h1>
        <p>Backend service ready 🚀</p>

        <a href="/produk/api/">📦 Produk API</a>
        <a href="/produk/sync/">🔄 Load Data</a>
        <a href="/produk/bisa-dijual/">✅ Produk Bisa Dijual</a>

        <footer>
            Django • DRF • FastPrint
        </footer>
    </div>
</body>
</html>
